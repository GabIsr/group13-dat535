name: DAT535 — Dev Pipeline & Quality Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Pipeline & Automated Tests
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve output directory
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/dev" >> "$GITHUB_OUTPUT"

      - name: Execute Automated Test Suite Gate
        run: |
          source ~/spark-env/bin/activate
          if [ -n "$SPARK_HOME" ]; then unset SPARK_HOME; fi
          echo "=== PySpark & Java Runtime Verification ==="
          python -c "import sys, pyspark; print(f'Python: {sys.version.split()[0]} | PySpark: {pyspark.__version__}')"
          java -version 2>&1 | head -n 2 || true
          echo "=== Running Automated Unit & Integration Tests ==="
          python $GITHUB_WORKSPACE/run_project.py test

      - name: Execute Medallion Pipeline (Incremental CDC -> Silver -> Gold)
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
        run: |
          source ~/spark-env/bin/activate
          if [ -n "$SPARK_HOME" ]; then unset SPARK_HOME; fi
          mkdir -p "$DAT535_OUTPUT_DIR"
          
          echo "=== Running Course Project Medallion Pipeline ==="
          python $GITHUB_WORKSPACE/run_project.py all --env dev

      - name: Publish Data Quality & Incident Scorecard to Summary
        if: always()
        run: |
          source ~/spark-env/bin/activate
          if [ -n "$SPARK_HOME" ]; then unset SPARK_HOME; fi
          echo "=== Publishing Data Quality Scorecard ==="
          python $GITHUB_WORKSPACE/src/utils/publish_ci_summary.py

      - name: Upload Data Quality Reports & Anomaly Ledgers
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dev-quality-reports-${{ github.run_number }}
          path: data/metadata/quality/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Gold Analytical Marts
        uses: actions/upload-artifact@v7
        with:
          name: dev-gold-marts-${{ github.run_number }}
          path: data/gold/
          retention-days: 30
          if-no-files-found: ignore
